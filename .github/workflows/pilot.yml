name: Collect ads (pilot)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "meta, google or both"
        default: "both"
      limit:
        description: "Max ads per resort per platform"
        default: "150"
      reuse_since:
        description: "Optional: reuse Apify runs started after this UTC time (e.g. 2026-11-10T16:40) instead of paying again"
        default: ""
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect ads through Apify
        env:
          PYTHONUNBUFFERED: "1"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          REUSE_SINCE: ${{ inputs.reuse_since }}
        run: python collect.py --platform ${{ inputs.platform }} --limit ${{ inputs.limit }}
      - name: Save data
        if: always()
        run: |
          git config user.name "ad-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "ad collection $(date -u +%F_%H%M)"
          git pull --rebase --quiet && git push
      - name: Keep the data even if saving to the repo failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ad-data
          path: data/
          retention-days: 14
