name: Ad library (weekly)
on:
  schedule:
    # every hour on Mon, Tue, Thu, Fri - run.py only does what's due, so extra or late runs are harmless
    - cron: "41 * * * 1,2,4,5"
  workflow_dispatch:
    inputs:
      action:
        description: "auto (whatever is due), collect-meta, collect-google, collect-both, report, build"
        default: "auto"
permissions:
  contents: write
concurrency: collect
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, save images, tag, report, rebuild the site
        env:
          PYTHONUNBUFFERED: "1"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ACTION: ${{ inputs.action || 'auto' }}
        run: |
          case "$ACTION" in
            auto)            python run.py --auto ;;
            collect-meta)    python run.py --collect meta ;;
            collect-google)  python run.py --collect google ;;
            collect-both)    python run.py --collect both ;;
            report)          python run.py --report ;;
            build)           python run.py --build ;;
            *) echo "unknown action $ACTION"; exit 1 ;;
          esac
      - name: Save data and site
        if: always()
        run: |
          git config user.name "ad-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "ad library $(date -u +%F_%H%M)"
          git pull --rebase --quiet && git push
      - name: Keep the data even if saving to the repo failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ad-data
          path: |
            data/
            docs/
          retention-days: 14
